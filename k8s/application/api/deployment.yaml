
apiVersion: apps/v1
kind: deployement

metadata:
  name: app-api

spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-api
  
  template:
    metadata:
      labels: app-api
    spec:
      containers:
        - name: app-api
          image: yakazdao/app-api:1.1
          ports:
            containersPort: 8000
            
          env:
          - name: OTEL_SERVICE_NAME
            value: "app-api"

          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector.observability.svc.cluster.local:4317"

          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: "grpc"

          - name: OTEL_TRACES_EXPORTER
            value: "otlp"

          - name: OTEL_METRICS_EXPORTER
            value: "otlp"

          - name: OTEL_LOGS_EXPORTER
            value: "none"
            


